 * --------------------------------------------------------------------------------------------------

 *   - pornește camera frontală ASCUNS când începe testul și o oprește când testul se termină;
 *   - măsoară oboseala obiectiv (PERCLOS: cât timp ochii stau închiși lent), pe minute și pe etape ale testului;
 *   - urmărește calitatea măsurătorii (față vizibilă, lumină, poziția camerei);
 *   - la final întoarce un RAPORT STRUCTURAT (JSON) + o variantă HTML gata de afișat.
 * Ce NU face: nu salvează și nu trimite imagini; nu detectează emoții, stres sau „minciuni”.
 * Singurul element vizibil cât rulează: un indicator mic „Cameră activă” (obligatoriu pentru transparență).
 *
 * Utilizare (vezi și exemplul integrat în ASTRO-PSY):
 *   <script src="nabu-background-monitor.js"><\/script>
 *   const mon = NabuBackgroundMonitor.create({ astronaut: 'Ana' });
 *   if (await mon.requestConsent()) await mon.start({ test: 'ASTRO-PSY' });   // la „Începe testul”
 *   mon.mark('PVT');                                                         // opțional: etapa curentă
 *   const raport = await mon.stop({ selfReport: { kss: 6, sp: 4 }, testResults: { ... } }); // la final
 *   container.innerHTML = NabuBackgroundMonitor.renderReportHTML(raport);
 *
 * Fără cod de integrare (doar evenimente):
 *   window.dispatchEvent(new CustomEvent('nabu:test-start', { detail: { astronaut: 'Ana' } }));
 *   window.dispatchEvent(new CustomEvent('nabu:test-mark',  { detail: { phase: 'PVT' } }));
 *   window.dispatchEvent(new CustomEvent('nabu:test-end',   { detail: { selfReport: {...}, testResults: {...} } }));
 *   window.addEventListener('nabu:report', e => console.log(e.detail));     // raportul final
 *
 * Dependențe: niciuna de instalat. MediaPipe Face Landmarker 0.10.14 se încarcă de pe CDN la primul start.
 * Camera funcționează doar pe https:// sau http://localhost (nu din file://).

/* ======================= 2. MOTORUL PERCLOS (pe minute și pe etape) ======================= */
class Engine {

/* ======================= 3. CALITATEA CAMEREI ======================= */
function adviseCamera(g){

  else if (g.w > 0.65) a.push({ k: 'near', msg: 'astronaut too close to the camera' });
  if (g.cx < 0.3 || g.cx > 0.7) a.push({ k: 'side', msg: 'face at the edge of the frame' });
  if (g.cy < 0.22 || g.cy > 0.68) a.push({ k: 'vert', msg: 'camera tilted too high or too low' });
  if (Math.abs(g.yaw || 0) > 20) a.push({ k: 'yaw', msg: 'head turned away from the camera' });
  if (g.lookDown != null && g.lookDown > 0.45) a.push({ k: 'gazeDown', msg: 'looking down at the camera (camera above the eyes), eyelids look more closed' });
  else if (g.lookUp != null && g.lookUp > 0.45) a.push({ k: 'gazeUp', msg: 'camera below eye level' });

}

  vert: 'Tilt the camera towards the face.', yaw: 'The camera must be in front of the astronaut, not to the side.',
  gazeDown: 'Put the camera at eye level, or the test window right below the camera.', gazeUp: 'Raise the camera to eye level.',
  small: 'Bring the device closer or use a higher-resolution camera.'

/* ======================= 4. SURSE: camera (MediaPipe) și simulare ======================= */

function buildReport({ meta, fatigue, quality, selfReport, testResults, history, error, framing = null }){
  const real = meta.source === 'camera';
  const prev = history.filter(h => h.astronaut === meta.astronaut && h.perclos != null).map(h => h.perclos);
  let baseline = { sessions: prev.length, mean: null, sd: null, z: null, basis: null };
  let objTired = null;
  if (fatigue && fatigue.perclos != null){
    if (prev.length >= CFG.minBaseline){
      const m = prev.reduce((a, b) => a + b, 0) / prev.length;
      const sd = Math.max(Math.sqrt(prev.reduce((a, b) => a + (b - m) ** 2, 0) / (prev.length - 1)), CFG.sdFloor, 0.05 * m);
      baseline = { sessions: prev.length, mean: r1(m), sd: r1(sd), z: Math.round((fatigue.perclos - m) / sd * 100) / 100, basis: 'baseline personal' };
      objTired = baseline.z >= CFG.zFlag;
    } else { baseline.basis = `reference ${CFG.perclosAbs}%; personal baseline in progress, ${prev.length}/${CFG.minBaseline} sessions`; objTired = fatigue.perclos >= CFG.perclosAbs; }
  }
  const kss = selfReport && selfReport.kss != null ? +selfReport.kss : null, sp = selfReport && selfReport.sp != null ? +selfReport.sp : null;
  const selfTired = (kss == null && sp == null) ? null : ((kss ?? 0) >= 7 || (sp ?? 0) >= 5);

  let status, headline, level;
  if (objTired == null){ status = 'not enough data'; level = 'info';
    headline = error ? 'Camera measurement was not possible. The report only has the self-assessment and the test results.' : 'Not enough valid frames for PERCLOS.'; }
  else if (objTired && selfTired){ status = 'rest recommended'; level = 'bad'; headline = 'The reported fatigue is confirmed by the measurements. Rest comes first.'; }
  else if (objTired && !selfTired){ status = 'watch'; level = 'warn'; headline = 'The measurements show signs of fatigue. A break or more sleep could help.'; }
  else if (!objTired && selfTired){ status = 'watch'; level = 'warn'; headline = 'You feel tired although the measurements are normal. How you feel matters: take it into account.'; }
  else { status = 'all good'; level = 'ok'; headline = 'No objective signs of fatigue, and the self-assessment agrees.'; }

  const points = [];
  if (fatigue && fatigue.perclos != null){
    points.push(`PERCLOS ${fatigue.perclos}% over ${fatigue.validMinutes} ${fatigue.validMinutes === 1 ? 'valid minute' : 'valid minutes'}` +
      (baseline.z != null ? ` (z ${baseline.z >= 0 ? '+' : ''}${baseline.z} vs your average of ${baseline.mean}%)` : ` (${baseline.basis})`) + '.');
    const hi = fatigue.perPhase.filter(p => p.valid).sort((a, b) => b.perclos - a.perclos)[0];
    if (hi && fatigue.perPhase.filter(p => p.valid).length > 1) points.push(`Most slow eye closures happened during “${hi.phase}” (PERCLOS ${hi.perclos}%).`);
    points.push(`${fatigue.slowClosures} slow eye closures` + (fatigue.meanSlowMs ? `, lasting ${fatigue.meanSlowMs} ms on average` : '') + `; ${fatigue.blinksPerMin ?? '–'} blinks per minute.`);
  }
  if (selfTired != null) points.push(`Self-assessment: ${selfTired ? 'tired' : 'fine'} (KSS ${kss ?? '–'}, Samn-Perelli ${sp ?? '–'}).`);
  if (framing && framing.outCount) points.push(`The eyes left the frame ${framing.outCount} ${framing.outCount === 1 ? 'time' : 'times'}, ${framing.outS} s in total.`);
  const susp = (framing && framing.suspensions) || [], notified = susp.filter(x => x.teamNotified);
  if (susp.length) points.push(`The test was paused ${susp.length} ${susp.length === 1 ? 'time' : 'times'} (“Are you OK?”): ` +
    susp.map(x => `at ${x.atS} s, ${x.answer ? 'answered after ' + (x.rtMs / 1000).toFixed(1) + ' s' : 'no answer, the team was alerted'}`).join('; ') + '.');
  if (notified.length){ level = 'bad'; status = 'urgent'; headline = 'The astronaut did not answer the “Are you OK?” check. The team was alerted.'; }
  if (quality.issues.length) points.push('Measurement quality: ' + quality.issues.map(i => `${i.msg} (${i.pct}% of the time)`).join('; ') + '.');
  if (!real) points.push('SIMULATED signal (demo): the values do not come from a person and are not added to the baseline.');

  const recommendations = [];
  if (level === 'bad') recommendations.push('Postpone critical tasks and put sleep first.');
  if (level === 'warn' && objTired) recommendations.push('A short break and a check of sleep over the last nights.');
  if (objTired) recommendations.push('If the result repeats over several days, talk to the flight surgeon.');
  quality.issues.forEach(i => recommendations.push(QUALITY_TIPS[i.k]));

  return {
    schema: CFG.SCHEMA, generatedAt: new Date().toISOString(),
    astronaut: meta.astronaut, test: { name: meta.test, startedAt: meta.startedAt, endedAt: meta.endedAt, durationS: meta.durationS },
    source: { type: meta.source, simulated: !real, error: error || null },
    summary: { status, level, headline, points, recommendations: [...new Set(recommendations)] },
    selfReport: { kss, samnPerelli: sp, ...(selfReport || {}) },
    fatigue: fatigue ? { perclos: fatigue.perclos, perclosMax: fatigue.perclosMax, blinksPerMin: fatigue.blinksPerMin, slowClosures: fatigue.slowClosures,
                         meanSlowMs: fatigue.meanSlowMs, validMinutes: fatigue.validMinutes, totalMinutes: fatigue.totalMinutes,
                         perMinute: fatigue.perMinute, perPhase: fatigue.perPhase, baseline, objectiveTired: objTired } : null,
    concordance: { selfTired, objectiveTired: objTired, message: headline },
    dataQuality: { validPct: fatigue ? fatigue.validPct : 0, facePct: fatigue ? fatigue.facePct : 0, hiddenS: meta.hiddenS, issues: quality.issues, framing },
    testResults: testResults || null,
    limits: ['PERCLOS is an indicator of alertness, not a diagnosis.', 'Emotions, stress or how honest the answers are cannot be detected.',
             'Values depend on light, glasses and camera position; minutes with under 70% valid frames get no value.',
             'Thresholds are indicative; the crew and the flight surgeon decide.'],
    privacy: 'Processed locally. No images were saved or sent; the report only has numbers.'
  };
}

<script>
/* Nabu · legătura dintre testul ASTRO-PSY și monitorul de fond.
 * Testul anunță doar două lucruri: etapa curentă (stage) și finalul (end). Restul se întâmplă aici:
 *   „Începe testul”  → pornește monitorul ascuns (după acord, o singură dată)
 *   fiecare etapă    → se notează în raport (oboseală pe etape)
 *   rezultatul final → monitorul se oprește și raportul Nabu apare sub rezultatul ASTRO-PSY
 *   „Test nou” / înapoi la start → monitorul se oprește fără raport
 * Din rezultatul testului se trimit în raport doar indicele, verdictul, PVT și testele cognitive.
 * Răspunsurile clinice (C-SSRS, PHQ-9, GAD-7) NU intră în raportul monitorului. */
window.NabuASTRO = (function () {
  'use strict';
  const PHASES = { s1: 'Safety & fatigue (VAS, Samn-Perelli, KSS)', sq: 'Questionnaires (PHQ-9, GAD-7)', s2: 'Sleep',
                   s3: 'Workload (NASA-TLX)', s4: 'Vigilance (PVT-B)', s5: 'Cognitive tests' };
  const TASKS = { j: ['Motor speed', 'ms/target'], a: ['Code substitution', '/min'], b: ['Associative memory', '/min'], d: ['Visual matching', '/min'],
                  f: ['Spatial orientation', '/min'], g: ['Abstract reasoning', '/min'], i: ['Risk taking', 'pumps'], e: ['Delayed code memory', '/min'] };
  const KEY_SRC = 'nabu.astro.source';
  let mon = null, prev = 'intro', starting = null, last = null;
  const getSrc = () => { try { return localStorage.getItem(KEY_SRC) || 'camera'; } catch (e) { return 'camera'; } };
  const setSrc = v => { try { localStorage.setItem(KEY_SRC, v); } catch (e) {} };
  const r1 = x => (typeof x === 'number' && isFinite(x)) ? Math.round(x * 10) / 10 : null;

  // așteaptă ca React să afișeze containerul, apoi îl completează
  function whenEl(id, fn, tries = 40) { const el = document.getElementById(id); if (el) fn(el); else if (tries > 0) setTimeout(() => whenEl(id, fn, tries - 1), 50); }

  function renderControl(id = 'nabu-astro-ctl') {
    whenEl(id, el => {
      if (el.dataset.ready) return; el.dataset.ready = '1';
      el.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px dashed #CBD5E1;border-radius:12px;padding:10px 12px;font-size:13px">
        <b>Nabu · fatigue measured in the background (PERCLOS):</b>
        <select data-nabu-src style="font:inherit;padding:5px 8px;border-radius:8px;border:1px solid #CBD5E1;background:#fff">
          <option value="camera">Front camera</option><option value="simulated-alert">Simulation: rested (demo)</option>
          <option value="simulated-tired">Simulation: tired (demo)</option><option value="off">Off</option></select>
        <span style="color:#64748B">Starts hidden at “Start the test” and stops at the result. No images are saved.</span></div>`;
      const s = el.querySelector('[data-nabu-src]'); s.value = getSrc(); s.onchange = () => { setSrc(s.value); document.querySelectorAll('[data-nabu-src]').forEach(x => x.value = s.value); };
    });
  }

  async function start(m, testName = 'ASTRO-PSY · monitoring') {
    const src = getSrc(); if (src === 'off' || !window.NabuBackgroundMonitor) return;
    const who = (m && m.astronautId) || 'Astronaut';
    mon = mon || NabuBackgroundMonitor.create({ astronaut: who });
    if (src === 'camera' && !(await mon.requestConsent())) return;   // fără acord: testul merge normal
    const r = await mon.start({ astronaut: who, test: testName, source: src });
    if (!r.ok) console.warn('The Nabu monitor did not start:', r.reason);
  }

  const EMBED = !!window.NABU_EMBED;
  async function stage(d, m) {
    if (d === 'intro') { if (!EMBED && mon && mon.running) mon.cancel(); last = null; prev = d; if (!EMBED) renderControl(); return; }
    if (d === 'result') { prev = d; if (last) renderReport(); return; }
    if (PHASES[d]) {
      if (prev === 'intro' && !(mon && mon.running)) { starting = start(m); await starting; starting = null; }
      if (mon && mon.running) mon.mark(PHASES[d]);
    }
    prev = d;
  }

  async function end(answers, res) {
    if (starting) await starting;
    const a = answers || {}, o = res || {}, cog = {};
    // a positive C-SSRS screen goes to Nabu as a flag only (never the answers): Guardian alerts the psychologist
    if (EMBED){ const c = a.cssrs || {}; if (c.q1 || c.q2 || c.q6) try { parent.postMessage({ src: 'psy', type: 'cssrs-flag', level: (c.q6 || c.q4 || c.q5) ? 3 : 2 }, '*'); } catch (e){} }
    if (!mon || !mon.running) return;
    Object.entries(a.tasks || {}).forEach(([k, t]) => { if (t && TASKS[k]) cog[TASKS[k][0]] = `${r1(t.throughput)} ${TASKS[k][1]}`; });
    last = await mon[EMBED ? 'snapshot' : 'stop']({
      selfReport: { kss: a.kss, sp: a.samnPerelli, vasComposite: r1(o.vasComposite), tlxMean: r1(o.tlxMean) },
      testResults: { index: r1(o.index), verdict: o.verdict, incomplete: !!o.incomplete, form: a.formNo, sessionType: a.sessionType,
                     pvt: a.pvt ? { meanRT: Math.round(a.pvt.meanRT), lapses: a.pvt.lapses, falseStarts: a.pvt.falseStarts, trials: a.pvt.trials } : null,
                     cog: Object.keys(cog).length ? cog : null }
    });
    renderReport();
  }

  function renderReport(id = 'nabu-astro-report', rep = last) {
    if (!rep || EMBED) return;
    whenEl(id, el => {
      el.innerHTML = `<div style="border:1px solid #CBD5E1;border-radius:16px;padding:16px;background:#fff;display:grid;gap:12px">
        <div style="font-weight:600;font-size:16px">Nabu · fatigue measured during the test</div>
        ${NabuBackgroundMonitor.renderReportHTML(rep)}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button data-dl="json" style="font:600 13px system-ui;border:1px solid #CBD5E1;border-radius:10px;padding:8px 12px;background:#F8FAFC;cursor:pointer">Download the report (JSON)</button>
          <button data-dl="html" style="font:600 13px system-ui;border:1px solid #CBD5E1;border-radius:10px;padding:8px 12px;background:#F8FAFC;cursor:pointer">Download the report (HTML)</button></div></div>`;
      el.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => NabuBackgroundMonitor.downloadReport(rep, b.dataset.dl));
    });
  }


  /* ---------- testul de selecție (capitolul 2) ---------- */
  const MISSIONS = { iss: 'Space Station (ISS)', moon: 'Lunar mission (Artemis)', mars: 'Mars expedition' };
  let selPrev = 'intro', selPhase = null, selStarting = null, selLast = null, selDone = false;
  async function sel(o, phase, name, profile, result) {
    if (o === 'intro') { if (!EMBED && mon && mon.running) mon.cancel(); selPrev = 'intro'; selPhase = null; selLast = null; selDone = false; if (!EMBED) renderControl('nabu-sel-ctl'); return; }
    if (o === 'run' || o === 'confirm') {
      if (selPrev === 'intro' && !(mon && mon.running)) { selPrev = o; selStarting = start({ astronautId: name }, 'ASTRO-PSY · selection'); await selStarting; selStarting = null; }
      selPrev = o;
      const ph = o === 'confirm' ? 'Answer review' : (phase ? 'Section ' + phase : null);
      if (ph && ph !== selPhase && mon && mon.running){ selPhase = ph; mon.mark(ph); }
      return;
    }
    if (o === 'result') {
      if (selLast){ renderReport('nabu-sel-report', selLast); return; }
      if (!result || selDone) return; selDone = true;
      if (selStarting) await selStarting;
      if (!mon || !mon.running) return;
      const mis = result.missions && result.missions[profile];
      const doms = {}; Object.entries(result.domains || {}).forEach(([k, d]) => { doms['Section ' + k] = `${d.points}/16 points`; });
      selLast = await mon[EMBED ? 'snapshot' : 'stop']({
        selfReport: null,
        testResults: { rows: [['Selection score', `${result.total} / 80 points · ${result.barem ? result.barem.label : ''}`],
                              ...(mis ? [[MISSIONS[profile] || profile, `${mis.verdict} (index ${Math.round(mis.index)})`]] : []),
                              ['Answers', `${result.answered} / 40 in ${Math.round((result.seconds || 0) / 60)} min`]],
                       cog: doms, passed: !!result.passed }
      });
      renderReport('nabu-sel-report', selLast);
    }
  }

  // selectorul principal, în capitolul 1 (Prezentare generală); se aplică testelor din capitolele 2 și 3
  function renderHome(){
    if (EMBED) return;
    whenEl('nabu-home-ctl', el => {
      if (el.dataset.ready) return; el.dataset.ready = '1';
      el.innerHTML = `<div style="border:1px solid #CBD5E1;border-radius:16px;padding:14px 16px;background:#fff;display:grid;gap:8px">
        <div style="font-weight:600;font-size:15px">Nabu · camera for measuring fatigue (PERCLOS)</div>
        <div style="font-size:13px;color:#64748B">Applies to the tests in chapter 2 (Selection) and chapter 3 (In-mission monitoring). The camera starts hidden at “Start the test” and stops at the result. No images are saved.</div>
        <select data-nabu-src style="font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid #CBD5E1;background:#fff;max-width:320px">
          <option value="camera">Front camera</option><option value="simulated-alert">Simulation: rested (demo)</option>
          <option value="simulated-tired">Simulation: tired (demo)</option><option value="off">Off</option></select></div>`;
      const s = el.querySelector('[data-nabu-src]'); s.value = getSrc();
      s.onchange = () => { setSrc(s.value); document.querySelectorAll('[data-nabu-src]').forEach(x => x.value = s.value); };
    }, 100);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderHome); else renderHome();

  window.addEventListener('pagehide', () => { if (mon) mon.cancel(); });
  if (EMBED){
    // camera on as soon as the test opens (consent was given once, before flight, in Nabu)
    try { localStorage.setItem('nabu.bgmon.v1.consent', JSON.stringify({ accepted: true, date: new Date().toISOString(), via: 'Nabu pre-flight agreement' })); } catch (e){}
    const who = window.NABU_ASTRONAUT || 'Astronaut';
    setTimeout(() => { starting = start({ astronautId: who }, 'ASTRO-PSY'); starting.then(() => (starting = null)); }, 300);
    window.addEventListener('nabu:report', (e) => { try { parent.postMessage({ src: 'psy', type: 'report', report: e.detail }, '*'); } catch (_){} });
    window.addEventListener('message', (e) => { const d = e.data || {}; if (d.src === 'nabu' && d.type === 'stop' && mon) mon.cancel(); });
  }
  return { stage, end, sel, lastReport: () => last };
})();
